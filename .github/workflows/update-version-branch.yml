name: Update Version Branch

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft Version'
        required: false
        type: string

jobs:
  call-update-version-branch:
    uses: TwelveIterations/PortingScripts/.github/workflows/update-version-branch.yml
    with:
      minecraft_version: ${{ inputs.minecraft_version }}
    secrets:
      AUTOMATIONS_APP_ID: ${{ vars.AUTOMATIONS_APP_ID }}
      AUTOMATIONS_PRIVATE_KEY: ${{ secrets.AUTOMATIONS_PRIVATE_KEY }}
